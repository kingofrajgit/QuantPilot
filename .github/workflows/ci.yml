name: QuantPilot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-and-quality:
    name: Security Scan, Linting & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Pytest Standard Suite (No Credentials Required)
        run: |
          pytest -v -m "not external"

      - name: Verify External Tests Skip Safely
        run: |
          pytest -v -m "external"
